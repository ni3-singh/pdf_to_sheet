<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 16px 20px;
        color: #333;
        margin: 0;
      }
      .brand-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid #ebebeb;
      }
      .brand-logo {
        width: 44px;
        height: 44px;
        object-fit: contain;
        border-radius: 6px;
      }
      .brand-title {
        font-size: 17px;
        font-weight: 700;
        color: #202124;
      }
      .brand-subtitle {
        font-size: 12px;
        color: #5f6368;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 6px;
        color: #444;
      }
      input[type="text"], input[type="file"] {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 13px;
      }
      input[type="text"]:focus {
        border-color: #1a73e8;
        outline: none;
      }
      .btn-container {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        padding: 9px 18px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
      }
      .btn-submit {
        background-color: #1a73e8;
        color: #fff;
      }
      .btn-submit:disabled {
        background-color: #a0c3f5;
        cursor: not-allowed;
      }
      .btn-cancel {
        background-color: #f1f3f4;
        color: #3c4043;
      }
      #statusMessage {
        margin-top: 14px;
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 4px;
        display: none;
      }
      .status-info { background-color: #e8f0fe; color: #1a73e8; }
      .status-error { background-color: #fce8e6; color: #c5221f; }
      .status-success { background-color: #e6f4ea; color: #137333; }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid rgba(26, 115, 232, 0.3);
        border-radius: 50%;
        border-top-color: #1a73e8;
        animation: spin 0.8s linear infinite;
        margin-right: 6px;
        vertical-align: middle;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

      <div>
        <div class="brand-title">Commerciology</div>
        <div class="brand-subtitle">Bank Statement Extractor</div>
      </div>
    </div>

    <div class="form-group">
      <label for="bankName">Bank Name (Tab Name)</label>
      <input type="text" id="bankName" placeholder="e.g. HDFC Bank, SBI, ICICI" autofocus />
    </div>

    <div class="form-group">
      <label for="pdfFile">Upload PDF Bank Statement</label>
      <input type="file" id="pdfFile" accept="application/pdf" />
    </div>

    <div id="statusMessage"></div>

    <div class="btn-container">
      <button class="btn-cancel" onclick="google.script.host.close()">Cancel</button>
      <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">Upload & Extract</button>
    </div>

    <script>
      function setStatus(text, type, showSpinner = false) {
        const box = document.getElementById("statusMessage");
        box.className = "status-" + type;
        box.style.display = "block";
        box.innerHTML = (showSpinner ? '<span class="spinner"></span>' : '') + text;
      }

      function handleSubmit() {
        const bankName = document.getElementById("bankName").value.trim();
        const fileInput = document.getElementById("pdfFile");
        const submitBtn = document.getElementById("submitBtn");

        if (!bankName) {
          setStatus("Please enter a Bank Name.", "error");
          return;
        }

        if (!fileInput.files || fileInput.files.length === 0) {
          setStatus("Please select a PDF file.", "error");
          return;
        }

        const file = fileInput.files[0];
        if (!file.name.toLowerCase().endsWith(".pdf")) {
          setStatus("Only PDF files are supported.", "error");
          return;
        }

        submitBtn.disabled = true;
        setStatus("Reading file & processing PDF tables...", "info", true);

        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Data = e.target.result.split(",")[1];
          
          google.script.run
            .withSuccessHandler(function(res) {
              setStatus("Done! Created tab <b>" + res.sheetName + "</b> with " + res.rowCount + " rows.", "success");
              setTimeout(function() {
                google.script.host.close();
              }, 1500);
            })
            .withFailureHandler(function(err) {
              submitBtn.disabled = false;
              setStatus("Error: " + err.message, "error");
            })
            .processBankStatement(bankName, base64Data, file.name);
        };

        reader.onerror = function() {
          submitBtn.disabled = false;
          setStatus("Failed to read the local file.", "error");
        };

        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
