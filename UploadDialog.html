<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root {
        --primary: #1a73e8;
        --primary-hover: #1557b0;
        --primary-light: #e8f0fe;
        --primary-disabled: #a0c3f5;
        --success-bg: #e6f4ea;
        --success-fg: #137333;
        --error-bg: #fce8e6;
        --error-fg: #c5221f;
        --text-main: #202124;
        --text-secondary: #5f6368;
        --border-color: #dadce0;
        --bg-surface: #f8f9fa;
        --radius: 8px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 20px 24px;
        color: var(--text-main);
        margin: 0;
        background-color: #fff;
        -webkit-font-smoothing: antialiased;
      }

      .brand-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-color);
      }

      .brand-logo {
        width: 48px;
        height: 48px;
        object-fit: contain;
        border-radius: 8px;
        background-color: #ffffff;
        padding: 2px;
        border: 1px solid var(--border-color);
      }

      .brand-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.2px;
        color: var(--text-main);
      }

      .brand-subtitle {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-top: 2px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 6px;
        color: var(--text-main);
      }

      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 14px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        font-size: 13px;
        color: var(--text-main);
        background-color: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        outline: none;
      }

      .file-dropzone {
        border: 2px dashed var(--border-color);
        border-radius: var(--radius);
        padding: 20px 16px;
        text-align: center;
        background-color: var(--bg-surface);
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
      }

      .file-dropzone:hover, .file-dropzone.dragover {
        border-color: var(--primary);
        background-color: var(--primary-light);
      }

      .file-dropzone input[type="file"] {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }

      .dropzone-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        pointer-events: none;
      }

      .dropzone-icon {
        width: 28px;
        height: 28px;
        color: var(--text-secondary);
      }

      .dropzone-text {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-main);
      }

      .dropzone-hint {
        font-size: 11px;
        color: var(--text-secondary);
      }

      .file-info {
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        font-size: 13px;
      }

      .file-info-name {
        font-weight: 500;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 240px;
      }

      .file-remove-btn {
        background: none;
        border: none;
        color: var(--error-fg);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 2px 6px;
      }

      .file-remove-btn:hover {
        background-color: var(--error-bg);
        border-radius: 4px;
      }

      .btn-container {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
      }

      button {
        padding: 10px 20px;
        border-radius: var(--radius);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: background-color 0.2s, box-shadow 0.2s;
      }

      .btn-submit {
        background-color: var(--primary);
        color: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      .btn-submit:hover:not(:disabled) {
        background-color: var(--primary-hover);
      }

      .btn-submit:disabled {
        background-color: var(--primary-disabled);
        cursor: not-allowed;
      }

      .btn-cancel {
        background-color: #f1f3f4;
        color: #3c4043;
      }

      .btn-cancel:hover {
        background-color: #e8eaed;
      }

      #statusMessage {
        margin-top: 16px;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: var(--radius);
        display: none;
        line-height: 1.4;
      }

      .status-info { background-color: var(--primary-light); color: var(--primary); border: 1px solid #d2e3fc; }
      .status-error { background-color: var(--error-bg); color: var(--error-fg); border: 1px solid #fad2cf; }
      .status-success { background-color: var(--success-bg); color: var(--success-fg); border: 1px solid #ceead6; }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(26, 115, 232, 0.2);
        border-radius: 50%;
        border-top-color: var(--primary);
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: -2px;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

        <div class="brand-title">Commerciology</div>

    <div class="form-group">
      <label for="bankName">Bank Name (Tab Name)</label>
      <input type="text" id="bankName" placeholder="e.g. HDFC Bank, SBI, ICICI" autofocus />
    </div>

    <div class="form-group">
      <label>Upload PDF Bank Statement</label>
      <div class="file-dropzone" id="dropzone">
        <input type="file" id="pdfFile" accept="application/pdf" onchange="handleFileSelect(this)" />
        <div class="dropzone-content" id="dropzoneContent">
          <svg class="dropzone-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
          <div class="dropzone-text">Drag and drop your PDF here, or <span>browse</span></div>
          <div class="dropzone-hint">Supports PDF bank statements</div>
        </div>
      </div>
      <div class="file-info" id="fileInfo">
        <span class="file-info-name" id="fileNameDisplay"></span>
        <button type="button" class="file-remove-btn" onclick="removeFile()">Remove</button>
      </div>
    </div>

    <div id="statusMessage"></div>

    <div class="btn-container">
      <button class="btn-cancel" onclick="google.script.host.close()">Cancel</button>
      <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">Upload & Extract</button>
    </div>

    <script>
      function setStatus(text, type, showSpinner = false) {
        const box = document.getElementById("statusMessage");
        box.className = "status-" + type;
        box.style.display = "block";
        box.innerHTML = (showSpinner ? '<span class="spinner"></span>' : '') + text;
      }

      function handleFileSelect(input) {
        const fileInfo = document.getElementById("fileInfo");
        const dropzoneContent = document.getElementById("dropzoneContent");
        const fileNameDisplay = document.getElementById("fileNameDisplay");

        if (input.files && input.files.length > 0) {
          const file = input.files[0];
          fileNameDisplay.textContent = file.name;
          dropzoneContent.style.display = "none";
          fileInfo.style.display = "flex";
          document.getElementById("statusMessage").style.display = "none";
        }
      }

      function removeFile() {
        const fileInput = document.getElementById("pdfFile");
        const fileInfo = document.getElementById("fileInfo");
        const dropzoneContent = document.getElementById("dropzoneContent");
        
        fileInput.value = "";
        fileInfo.style.display = "none";
        dropzoneContent.style.display = "flex";
      }

      function handleSubmit() {
        const bankName = document.getElementById("bankName").value.trim();
        const fileInput = document.getElementById("pdfFile");
        const submitBtn = document.getElementById("submitBtn");

        if (!bankName) {
          setStatus("Please enter a Bank Name.", "error");
          return;
        }

        if (!fileInput.files || fileInput.files.length === 0) {
          setStatus("Please select a PDF file.", "error");
          return;
        }

        const file = fileInput.files[0];
        if (!file.name.toLowerCase().endsWith(".pdf")) {
          setStatus("Only PDF files are supported.", "error");
          return;
        }

        submitBtn.disabled = true;
        setStatus("Reading file & processing PDF tables...", "info", true);

        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Data = e.target.result.split(",")[1];
          
          google.script.run
            .withSuccessHandler(function(res) {
              setStatus("Done! Created tab <b>" + res.sheetName + "</b> with " + res.rowCount + " rows.", "success");
              setTimeout(function() {
                google.script.host.close();
              }, 1500);
            })
            .withFailureHandler(function(err) {
              submitBtn.disabled = false;
              setStatus("Error: " + err.message, "error");
            })
            .processBankStatement(bankName, base64Data, file.name);
        };

        reader.onerror = function() {
          submitBtn.disabled = false;
          setStatus("Failed to read the local file.", "error");
        };

        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
